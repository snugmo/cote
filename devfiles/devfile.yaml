# Generic DevWorkspaces workspace definition
# References the base dev image and provides extension points for IDEs and
# project-specific tools.
#
# Usage:
#   1. Build & push the base image:  ./base-image/build.sh push
#   2. Update the image reference below to match your registry
#   3. Apply to your cluster:  kubectl apply -f devfile.yaml
#   4. Or import via the DevWorkspaces dashboard
#
# IDEs (VS Code, Eclipse Che, etc.) should be added as separate components,
# not baked into the base image. See the `ide` component placeholder below.

schemaVersion: 2.2.0

metadata:
  name: cote

projects:
  - name: workspace
    git:
      remotes:
        origin: "https://github.com/snugmo/cote.git"
    checkoutFrom:
      revision: main
    clonePath: "{{.ProjectsRoot}}/{{.ProjectName}}"

components:
  # ------------------------------------------------------------------
  # Primary container — base dev toolchain image
  # ------------------------------------------------------------------
  - name: tools
    container:
      image: "ghcr.io/snugmo/cote:latest-base"
      mountSources: true
      memoryRequest: "512M"
      memoryLimit: "2Gi"
      cpuRequest: "500m"
      cpuLimit: "2"
      volumeMounts:
        - name: tools-cache
          path: /home/user/.cache
        - name: tools-local
          path: /home/user/.local

  # ------------------------------------------------------------------
  # IDE component placeholder
  # Uncomment and configure one of the following for your preferred IDE.
  # IDEs are added as *separate* components, not in the base image.
  # ------------------------------------------------------------------

  # VS Code (Eclipse Che plugin)
  # - name: vscode
  #   container:
  #     image: "eclipse/che-code-latest:stable"
  #     memoryLimit: "1Gi"
  #     endpoints:
  #       - name: vscode
  #         port: 3000
  #         expose: true
  #         attributes:
  #           type: main

  # ------------------------------------------------------------------
  # Persistent volumes
  # ------------------------------------------------------------------
  - name: tools-cache
    volume:
      size: 5Gi

  - name: tools-local
    volume:
      size: 2Gi

commands:
  # Common developer commands available in the workspace
  - id: run-tests
    exec:
      component: tools
      commandLine: "echo 'Run tests — customize per project'"
      workingDir: "${PROJECTS_ROOT}/${CURRENT_PROJECT}"

  - id: rebuild-base-image
    exec:
      component: tools
      commandLine: "buildah build -t cote:latest-base -f base-image/Containerfile base-image/"
      workingDir: "${PROJECTS_ROOT}"
