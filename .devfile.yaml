schemaVersion: 2.2.0
components:
  - name: tools
    container:
      image: "r5t.io/agentic/dev-workspace-base:0.19.0"
      mountSources: true
      memoryRequest: "4Gi"
      memoryLimit: "8Gi"
      cpuRequest: "500m"
      cpuLimit: "8"
      volumeMounts:
        - name: tools-cache
          path: /home/user/.cache
        - name: tools-local
          path: /home/user/.local

  - name: tools-cache
    volume:
      size: 5Gi

  - name: tools-local
    volume:
      size: 2Gi
